{% set name = "commlib-py" %}
{% set version = "0.13.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  - url: https://github.com/robotics-4-all/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
    sha256: f022f635316cc097c309d12659f7e60875d4eb9bc6f7656ebebdfe49824f124d

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  number: 0

requirements:
  host:
    - pip
    - setuptools >=61
    - wheel
    - python {{ python_min }}
  run:
    - redis-py >=5.0.1
    - rich >=13.7.0
    - paho-mqtt <2.0.0
    - pika >=1.3.1
    - python-confluent-kafka >=2.3.0
    - pydantic >=2.0.0
    - python >={{ python_min }}
    - requests >=2.32.0
    - ujson >=5.7.0
test:
  imports:
    - commlib
    - commlib.node
    - commlib.serializer
    - commlib.endpoints
    - commlib.transports
  requires:
    - pip
    - pytest
    - python {{ python_min }}
  source_files:
    - tests
  commands:
    - pip check
    - pytest --ignore=tests/mqtt --ignore=tests/redis --ignore=tests/kafka --ignore=tests/benchmarks -v

about:
  home: https://github.com/robotics-4-all/commlib-py
  summary: "Internal DSL for communication and messaging in CyberPhysical Systems"
  license: MIT
  license_file:
    - LICENSE

extra:
  recipe-maintainers:
    - klpanagi
    - MementoRC
